{% from "_components.html" import chip %}
{% if checks %}
<div class="space-y-1">
  {% for check in checks %}
  <div class="flex items-center gap-3 px-3 py-2 rounded-lg bg-ksf-surface/50 border border-ksf-border">
    <span class="chip chip-{{ check.status }}">{{ check.status }}</span>
    <span class="text-sm font-medium">{{ check.label }}</span>
    {% if check.detail %}<span class="text-xs text-ksf-muted ml-auto">{{ check.detail }}</span>{% endif %}
  </div>
  {% endfor %}
</div>
{% else %}
<div class="text-sm text-ksf-muted text-center py-8">Aucun check de diagnostic.</div>
{% endif %}
