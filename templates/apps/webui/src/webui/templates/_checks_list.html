<div>
  {% for c in checks %}
  <div class="card" style="padding:0.75rem;margin-bottom:0.5rem">
    <span class="{% if c.status == 'ok' %}status-ok{% elif c.status == 'warn' %}status-warn{% else %}status-err{% endif %}">
      {{ '✓' if c.status == 'ok' else '⚠' if c.status == 'warn' else '✗' }}
    </span>
    <strong>{{ c.label }}</strong>
    {% if c.detail %}<span class="text-muted text-sm"> — {{ c.detail }}</span>{% endif %}
  </div>
  {% else %}
  <p class="text-muted">Aucun check</p>
  {% endfor %}
</div>
