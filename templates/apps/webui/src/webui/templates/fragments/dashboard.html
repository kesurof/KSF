{% from "_components.html" import icon, empty_state, page_header, chip, stat_card, tabs %}
{% call page_header('Tableau de bord', subtitle='État actuel de la plateforme.', section='general') %}
<button class="btn btn-sm btn-ghost" hx-get="/ui/dashboard" hx-target="#fragment-content" hx-swap="outerHTML">{{ icon('refresh', 14) }} Actualiser</button>
{% endcall %}
<div class="metric-grid">
  <div class="metric-card"><div class="metric-body"><span class="metric-value">{{ apps|length }}</span><span class="metric-label">Applications</span></div></div>
  <div class="metric-card"><div class="metric-body"><span class="metric-value">{{ config.domain or '—' }}</span><span class="metric-label">Domaine</span></div></div>
</div>
<div class="flex gap-1 mb-1">
  <button class="btn btn-sm btn-ghost" hx-get="/api/status" hx-target="#dashboard-detail">{{ icon('activity', 14) }} Status complet</button>
  <button class="btn btn-sm btn-ghost" hx-get="/ui/general/doctor" hx-target="#dashboard-detail">{{ icon('stethoscope', 14) }} Doctor</button>
  <button class="btn btn-sm btn-ghost" hx-get="/ui/general/routes" hx-target="#dashboard-detail">{{ icon('route', 14) }} Routes</button>
  <button class="btn btn-sm btn-ghost" hx-get="/ui/general/config" hx-target="#dashboard-detail">{{ icon('settings', 14) }} Configuration</button>
  <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/infrastructure/restart" data-method="POST" data-confirm-message="Redémarrer l'infrastructure ?">{{ icon('refresh', 14) }} Redémarrer infra</button>
</div>
<div class="tabs" x-data="ksfTabs(4)">
  <div class="tabs-nav" role="tablist">
    <button type="button" role="tab" :class="{ active: active === 0 }" @click="select(0)">Status</button>
    <button type="button" role="tab" :class="{ active: active === 1 }" @click="select(1)">Diagnostic</button>
    <button type="button" role="tab" :class="{ active: active === 2 }" @click="select(2)">Routes</button>
    <button type="button" role="tab" :class="{ active: active === 3 }" @click="select(3)">Configuration</button>
  </div>
  <div class="tab-panel">
    <template x-if="active===0">
      <div>
        <div class="record-list">
          {% for app, state in apps %}<a class="record-row" href="/apps/{{ app.instance }}" hx-get="/ui/apps/{{ app.instance }}" hx-target="#content" hx-push-url="true">
            <span class="chip chip-{{ 'ok' if state.state == 'running' else 'warn' }}">{{ state.state }}</span>
            <strong>{{ app.display_name }}</strong>
            <span class="record-meta">{{ app.access_label }}</span>
          </a>{% endfor %}
        </div>
      </div>
    </template>
    <template x-if="active===1">
      <div hx-get="/ui/general/doctor" hx-trigger="load" hx-target="this"></div>
    </template>
    <template x-if="active===2">
      <div>{% include "_routes_table.html" %}</div>
    </template>
    <template x-if="active===3">
      <div hx-get="/ui/general/config" hx-trigger="load" hx-target="this"></div>
    </template>
  </div>
</div>
