{% from "_components.html" import icon, empty_state, page_header, chip %}
{% call page_header('CrowdSec', subtitle='Sécurité et bannissement d\'IPs malveillantes.', section='security') %}
<button class="btn btn-sm btn-ghost" hx-get="/ui/security" hx-target="#fragment-content" hx-swap="outerHTML">{{ icon('refresh', 14) }} Actualiser</button>
{% endcall %}
<div class="tabs" x-data="ksfTabs(3)">
  <div class="tabs-nav" role="tablist">
    <button type="button" role="tab" :class="{ active: active === 0 }" @click="select(0)">Consultation</button>
    <button type="button" role="tab" :class="{ active: active === 1 }" @click="select(1)">Actions</button>
    <button type="button" role="tab" :class="{ active: active === 2 }" @click="select(2)">AppSec</button>
  </div>
  <div class="tab-panel">
    <template x-if="active===0">
      <div class="card">
        <p class="text-muted">Alertes, décisions, métriques et statut CrowdSec.</p>
        <div class="flex gap-1 mt-1 flex-wrap">
          <button class="btn btn-sm" hx-get="/ui/security/crowdsec" hx-target="#security-output">{{ icon('activity', 14) }} Statut</button>
          <button class="btn btn-sm" hx-get="/ui/security/alerts" hx-target="#security-output" hx-indicator="#security-loading">{{ icon('bell', 14) }} Alertes</button>
          <button class="btn btn-sm" hx-get="/ui/security/decisions" hx-target="#security-output">{{ icon('ban', 14) }} Décisions</button>
          <button class="btn btn-sm" hx-get="/ui/security/metrics" hx-target="#security-output">{{ icon('chart', 14) }} Métriques</button>
          <button class="btn btn-sm" hx-get="/ui/security/bouncers" hx-target="#security-output">{{ icon('shield', 14) }} Bouncers</button>
          <button class="btn btn-sm" hx-get="/ui/security/console" hx-target="#security-output">{{ icon('terminal', 14) }} Console</button>
        </div>
        <span id="security-loading" class="htmx-indicator" role="status">Chargement...</span>
        <div id="security-output" aria-live="polite"></div>
      </div>
    </template>
    <template x-if="active===1">
      <div class="card">
        <p class="text-muted">Bannir/débannir une IP, vider les décisions, redémarrer.</p>
        <div class="flex gap-1 mt-1 flex-wrap">
          <a class="btn btn-sm" href="/security/ban" hx-get="/ui/security/ban" hx-target="#content" hx-push-url="true">{{ icon('ban', 14) }} Bannir</a>
          <a class="btn btn-sm" href="/security/unban" hx-get="/ui/security/unban" hx-target="#content" hx-push-url="true">{{ icon('refresh', 14) }} Débannir</a>
          <button class="btn btn-sm" data-ksf-confirm data-url="/api/crowdsec/decisions/flush" data-method="POST" data-confirm-message="Vider toutes les décisions ?">{{ icon('trash', 14) }} Flush decisions</button>
          <button class="btn btn-sm" data-ksf-confirm data-url="/api/crowdsec/restart" data-method="POST" data-confirm-message="Redémarrer CrowdSec ?">{{ icon('refresh', 14) }} Redémarrer CrowdSec</button>
          <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/trusted-ips/cloudflare" data-method="POST" data-confirm-message="Récupérer les IPs Cloudflare ?">{{ icon('download', 14) }} Trusted IPs Cloudflare (fetch)</button>
          <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/trusted-ips/cloudflare/apply" data-method="POST" data-confirm-message="Appliquer les IPs Cloudflare ?">{{ icon('refresh', 14) }} Trusted IPs Cloudflare (apply)</button>
        </div>
        <form class="flex items-center gap-1 mt-1" hx-post="/api/operations/crowdsec/enroll" hx-target="#security-output">
          <input name="token" type="text" placeholder="Token d'enrôlement" required>
          <input name="confirmed" type="hidden" value="true">
          <button class="btn btn-sm" type="submit">{{ icon('terminal', 14) }} Enroll</button>
        </form>
      </div>
    </template>
    <template x-if="active===2">
      <div class="card">
        <p class="text-muted">AppSec / WAF : activer, désactiver, métriques et test.</p>
        <div class="flex gap-1 mt-1 flex-wrap">
          <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/crowdsec/appsec/enable" data-method="POST" data-confirm-message="Activer AppSec ?">{{ icon('shield', 14) }} Activer</button>
          <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/crowdsec/appsec/disable" data-method="POST" data-confirm-message="Désactiver AppSec ?">{{ icon('shield', 14) }} Désactiver</button>
          <button class="btn btn-sm" hx-get="/ui/security/appsec" hx-target="#security-output">{{ icon('chart', 14) }} Métriques</button>
          <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/crowdsec/appsec/test" data-method="POST" data-confirm-message="Lancer le test AppSec ?">{{ icon('alert-triangle', 14) }} Test</button>
        </div>
        <div id="security-output" aria-live="polite"></div>
      </div>
    </template>
  </div>
</div>
