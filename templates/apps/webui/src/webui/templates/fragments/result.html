<section id="fragment-result" class="card" tabindex="-1" aria-live="polite">
  <h2 class="section-title">{{ title }}</h2>
  {% if error %}
  <p class="error-box" role="alert" tabindex="-1">{{ error }}</p>
  {% elif output %}
  <p class="success-box" role="status">Résultat chargé.</p>
  <pre class="fragment-output" tabindex="0" aria-label="{{ title }}">{{ output }}</pre>
  {% else %}
  <div class="empty-state"><p>Aucune donnée à afficher.</p></div>
  {% endif %}
</section>
