{% from "_components.html" import icon, empty_state, page_header, chip %}
{% call page_header('Opérations plateforme', subtitle='Actions groupées par catégorie.', section='general') %}{% endcall %}
<div class="card">
  <strong>Infrastructure</strong>
  <div class="flex gap-1 mt-1 mb-1">
    <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/infrastructure/restart" data-method="POST" data-confirm-message="Redémarrer l'infrastructure ?" data-hx-target="#fragment-content">{{ icon('refresh', 14) }} Redémarrer</button>
    <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/infrastructure/update-all" data-method="POST" data-confirm-message="Mettre à jour toute l'infrastructure ?" data-hx-target="#fragment-content">{{ icon('refresh', 14) }} Mettre à jour tout</button>
  </div>
</div>
<div class="card">
  <strong>Apps</strong>
  <div class="flex gap-1 mt-1">
    <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/apps/update-all" data-method="POST" data-confirm-message="Mettre à jour toutes les apps ?" data-hx-target="#fragment-content">{{ icon('refresh', 14) }} Mettre à jour toutes les apps</button>
  </div>
</div>
<div class="card">
  <strong>Plateforme</strong>
  <div class="flex gap-1 mt-1">
    <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/render" data-method="POST" data-confirm-message="Lancer le rendu ?" data-hx-target="#fragment-content">{{ icon('refresh', 14) }} Rendu</button>
    <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/protect" data-method="POST" data-confirm-message="Protéger les routes ?" data-hx-target="#fragment-content">{{ icon('shield', 14) }} Protéger les routes</button>
  </div>
</div>
<div class="card">
  <strong>Réseau</strong>
  <div class="flex gap-1 mt-1">
    <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/trusted-ips/cloudflare" data-method="POST" data-confirm-message="Récupérer les IPs Cloudflare ?">{{ icon('download', 14) }} CIDR Cloudflare (fetch)</button>
    <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/trusted-ips/cloudflare/apply" data-method="POST" data-confirm-message="Appliquer les IPs Cloudflare ?" data-hx-target="#fragment-content">{{ icon('refresh', 14) }} CIDR Cloudflare (apply)</button>
  </div>
</div>
<div class="card">
  <strong>CrowdSec</strong>
  <div class="flex gap-1 mt-1">
    <form class="flex items-center gap-1" hx-post="/api/operations/crowdsec/enroll" hx-target="#fragment-content" hx-swap="outerHTML">
      <input name="token" type="text" placeholder="Token d'enrôlement" required>
      <input name="confirmed" type="hidden" value="true">
      <button class="btn btn-sm" type="submit">{{ icon('refresh', 14) }} Enroll</button>
    </form>
  </div>
</div>
<div class="card">
  <strong>AppSec</strong>
  <div class="flex gap-1 mt-1">
    <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/crowdsec/appsec/enable" data-method="POST" data-confirm-message="Activer AppSec ?" data-hx-target="#fragment-content">{{ icon('shield', 14) }} Activer</button>
    <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/crowdsec/appsec/disable" data-method="POST" data-confirm-message="Désactiver AppSec ?" data-hx-target="#fragment-content">{{ icon('shield', 14) }} Désactiver</button>
    <button class="btn btn-sm" hx-get="/ui/security/appsec" hx-target="#security-output">{{ icon('chart', 14) }} Métriques</button>
    <button class="btn btn-sm" data-ksf-confirm data-url="/api/operations/crowdsec/appsec/test" data-method="POST" data-confirm-message="Lancer le test AppSec ?">{{ icon('alert-triangle', 14) }} Test</button>
  </div>
  <div id="security-output" aria-live="polite"></div>
</div>
