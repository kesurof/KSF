{% extends "base.html" %}
{% block content %}
<div x-data="infraPage()" x-init="load()">
  <div class="flex gap-2 items-center mb-1"><h1>Infrastructure</h1><button class="btn btn-sm btn-ghost" @click="load()">Rafraîchir</button></div>
  <template x-if="error"><p class="error-box" x-text="error"></p></template>
  <div class="card-grid"><template x-for="service in services" :key="service.name"><div class="card"><div class="card-header"><strong x-text="service.name"></strong><span :class="service.state === 'running' ? 'status-ok' : 'status-warn'" x-text="service.enabled ? service.state : 'non configuré'"></span></div><p class="text-muted text-sm" x-show="service.enabled" x-text="(service.running || 0) + ' service(s) actif(s) sur ' + (service.total || 0)"></p><div class="flex gap-1 mt-1" x-show="service.enabled"><button class="btn btn-sm btn-ghost" @click="action(service.name, 'restart')">Redémarrer</button><button class="btn btn-sm btn-ghost" @click="action(service.name, 'update')">Mettre à jour</button><a class="btn btn-sm btn-ghost" :href="'/logs?target=' + service.name">Logs</a></div></div></template></div>
</div>
<script>
function infraPage() { return { services: [], error: '', async load() { this.error = ''; try { this.services = (await ksfFetch('/api/services')).services; } catch (error) { this.error = ksfError(error); } }, async action(name, action) { try { await ksfFetch(`/api/services/${name}/${action}`, {method: 'POST'}); await this.load(); } catch (error) { this.error = ksfError(error); } } }; }
</script>
{% endblock %}
