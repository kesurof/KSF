{% extends "base.html" %}
{% block content %}
<div x-data="jobsPage()" x-init="load()">
  <div class="flex gap-2 items-center mb-1"><h1>Historique des jobs</h1><button class="btn btn-sm btn-ghost" @click="load()">Rafraîchir</button></div>
  <template x-if="error"><p class="error-box" x-text="error"></p></template>
  <div class="card" x-show="!jobs.length && !loading">Aucune opération enregistrée.</div>
  <div class="card" x-show="jobs.length"><table><thead><tr><th>Date</th><th>Action</th><th>Cible</th><th>Mode</th><th>État</th><th>Message</th></tr></thead><tbody><template x-for="job in jobs" :key="job.id"><tr><td class="text-sm" x-text="format(job.created_at)"></td><td x-text="job.action"></td><td x-text="job.target"></td><td x-text="job.dry_run ? 'simulation' : 'réel'"></td><td :class="statusClass(job.status)" x-text="job.status"></td><td class="text-sm" x-text="job.message"></td></tr></template></tbody></table></div>
</div>
<script>function jobsPage(){return{jobs:[],loading:false,error:'',async load(){this.loading=true;this.error='';try{this.jobs=(await ksfFetch('/api/jobs')).jobs;}catch(error){this.error=ksfError(error);}finally{this.loading=false;}},format(value){return value?new Date(value*1000).toLocaleString('fr-FR'):'—';},statusClass(status){return status==='completed'?'status-ok':status==='failed'?'status-err':'status-warn';}};}</script>
{% endblock %}
