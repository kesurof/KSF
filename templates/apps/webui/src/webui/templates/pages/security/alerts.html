{% extends "base.html" %}{% block content %}<div x-data="crowdsecOutput('alerts')" x-init="load()"><div class="flex gap-2 items-center mb-1"><h1>Alertes CrowdSec</h1><button class="btn btn-sm btn-ghost" @click="load()">Rafraîchir</button></div><template x-if="error"><p class="error-box" x-text="error"></p></template><pre x-text="output || (loading ? 'Chargement...' : 'Aucune alerte')"></pre></div><script>function crowdsecOutput(endpoint) { return {output:'',error:'',loading:false,async load(){this.loading=true;this.error='';try{this.output=(await ksfFetch('/api/crowdsec/'+endpoint)).output || '';}catch(error){this.error=ksfError(error);}finally{this.loading=false;}}};}</script>{% endblock %}
