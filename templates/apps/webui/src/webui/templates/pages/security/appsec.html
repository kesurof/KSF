{% extends "base.html" %}{% block content %}<div x-data="appsecPage()" x-init="load()"><div class="flex gap-2 items-center mb-1"><h1>AppSec / WAF</h1><button class="btn btn-sm btn-ghost" @click="load()">Rafraîchir</button></div><template x-if="error"><p class="error-box" x-text="error"></p></template><div class="card" x-show="status"><p>AppSec: <strong :class="status && status.enabled ? 'status-ok' : 'status-warn'" x-text="status && status.enabled ? 'activé' : 'désactivé'"></strong></p><p class="text-muted text-sm" x-text="status && status.appsec_yaml_present ? 'Configuration AppSec détectée.' : 'Aucune configuration AppSec détectée.'"></p></div></div><script>function appsecPage(){return{status:null,error:'',async load(){this.error='';try{this.status=await ksfFetch('/api/crowdsec/appsec/status');}catch(error){this.error=ksfError(error);}}};}</script>{% endblock %}
