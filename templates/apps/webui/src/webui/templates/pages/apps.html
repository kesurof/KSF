{% extends "base.html" %}
{% block title %}Applications | KSF Web UI{% endblock %}
{% block topbar_title %}Applications{% endblock %}
{% block content %}
<div class="max-w-6xl mx-auto">
  <div class="flex items-center justify-between mb-4">
    <p class="text-sm text-ksf-muted">Applications installées sur la plateforme.</p>
    <div class="flex gap-2">
      <a href="/apps/install" class="btn btn-primary btn-sm">
        <svg class="w-4 h-4" aria-hidden="true"><use href="#icon-plus"/></svg> Installer
      </a>
    </div>
  </div>
  <div hx-get="/ui/apps" hx-trigger="load" hx-swap="innerHTML">
    <div class="flex items-center gap-2 text-ksf-muted text-sm"><span class="spinner"></span> Chargement...</div>
  </div>
</div>
{% endblock %}
