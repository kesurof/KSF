{% extends "base.html" %}
{% block title %}{{ service_name }} | KSF Web UI{% endblock %}
{% block topbar_title %}{{ service_name|capitalize }}{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
  <div hx-get="/api/services/{{ service_name }}/status" hx-trigger="load" hx-swap="innerHTML">
    <div class="flex items-center gap-2 text-ksf-muted text-sm"><span class="spinner"></span> Chargement...</div>
  </div>
  <div class="flex gap-2 flex-wrap">
    <button class="btn btn-sm btn-danger" data-ksf-confirm data-url="/api/services/{{ service_name }}/restart" data-method="POST" data-confirm-message="Redémarrer {{ service_name }} ?" data-hx-target="#main">
      <svg class="w-4 h-4" aria-hidden="true"><use href="#icon-refresh"/></svg> Redémarrer
    </button>
    <button class="btn btn-sm" data-ksf-confirm data-url="/api/services/{{ service_name }}/update" data-method="POST" data-confirm-message="Mettre à jour {{ service_name }} ?" data-hx-target="#main">
      <svg class="w-4 h-4" aria-hidden="true"><use href="#icon-refresh"/></svg> Mettre à jour
    </button>
  </div>
  <details class="bg-ksf-surface border border-ksf-border rounded-xl p-4">
    <summary class="cursor-pointer text-sm font-medium text-ksf-muted hover:text-ksf-text">Logs</summary>
    <div class="mt-3 space-y-3">
      <form hx-get="/api/services/{{ service_name }}/logs" hx-target="#service-log-output" hx-indicator="#service-log-spinner" class="flex items-end gap-3">
        <div>
          <label for="log-tail" class="block text-xs text-ksf-muted mb-1">Lignes</label>
          <input id="log-tail" name="tail" type="number" min="1" max="5000" value="200" class="input">
        </div>
        <button class="btn btn-sm btn-primary" type="submit">
          <svg class="w-4 h-4" aria-hidden="true"><use href="#icon-scroll-text"/></svg> Charger
        </button>
        <span id="service-log-spinner" class="spinner htmx-indicator"></span>
      </form>
      <div id="service-log-output" class="space-y-2"></div>
    </div>
  </details>
</div>
{% endblock %}
