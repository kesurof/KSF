{% from "_components.html" import chip %}
<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
  <div class="bg-ksf-surface border border-ksf-border rounded-xl p-4">
    <div class="text-3xl font-bold tabular-nums text-ksf-text">{{ apps_total }}</div>
    <div class="text-sm text-ksf-muted mt-1">Applications</div>
  </div>
  <div class="bg-ksf-surface border border-ksf-border rounded-xl p-4">
    <div class="text-3xl font-bold tabular-nums text-ksf-success">{{ apps_running }}</div>
    <div class="text-sm text-ksf-muted mt-1">En fonctionnement</div>
  </div>
  <div class="bg-ksf-surface border border-ksf-border rounded-xl p-4">
    <div class="flex items-center gap-2">
      <span class="inline-block w-3 h-3 rounded-full {{ 'bg-ksf-success' if docker_available else 'bg-ksf-danger' }}"></span>
      <span class="text-sm font-medium">{{ 'Disponible' if docker_available else 'Indisponible' }}</span>
    </div>
    <div class="text-sm text-ksf-muted mt-1">Docker</div>
  </div>
  <div class="bg-ksf-surface border border-ksf-border rounded-xl p-4">
    <div class="text-sm font-medium truncate">{{ domain or 'Non configuré' }}</div>
    <div class="text-sm text-ksf-muted mt-1">Domaine</div>
  </div>
</div>
