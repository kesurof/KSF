[project]
name = "ksf-webui"
version = "0.1.0"
description = "Interface d'administration de la plateforme KSF"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "docker>=7.0.0",
  "fastapi>=0.110.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pip-audit>=2.7.0",
  "playwright>=1.52.0",
  "pytest>=8.0.0",
  "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Baseline non-regression. The legacy codebase is progressively migrated to the
# broader Ruff ruleset documented in docs/webui/testing.md.
select = ["E9", "F63", "F7", "F82"]
