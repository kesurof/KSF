services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: ${APP_INSTANCE}
    restart: unless-stopped
    networks:
      - proxy
    ${APP_PORTS_BLOCK}
    environment:
      - PUID=${APP_PUID}
      - PGID=${APP_PGID}
      - TZ=${TZ_VALUE}
    volumes:
      - ${BASE_DIR}/data/${APP_INSTANCE}/config:/config
      - ${BASE_DIR}/data/${APP_INSTANCE}/downloads:/downloads
      - ${BASE_DIR}/data/${APP_INSTANCE}/movies:/movies

networks:
  proxy:
    name: ${NETWORK_NAME}
    external: true
