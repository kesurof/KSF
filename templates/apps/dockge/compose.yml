services:
  dockge:
    image: louislam/dockge:1.5.0
    container_name: ${APP_INSTANCE}
    restart: unless-stopped
    networks:
      - proxy
    ${APP_PORTS_BLOCK}
    environment:
      - DOCKGE_STACKS_DIR=${BASE_DIR}/apps
      - DOCKGE_ENABLE_CONSOLE=false
      - PUID=${APP_PUID}
      - PGID=${APP_PGID}
      - TZ=${TZ_VALUE}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${BASE_DIR}/data/${APP_INSTANCE}:/app/data
      - ${BASE_DIR}/apps:${BASE_DIR}/apps

networks:
  proxy:
    name: ${NETWORK_NAME}
    external: true
