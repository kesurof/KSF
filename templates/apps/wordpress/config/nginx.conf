# KSF — Nginx config pour WordPress (FPM upstream)
# Genere par render_template depuis templates/apps/wordpress/config/nginx.conf
# Monte dans le conteneur web sous /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    server_tokens off;
    client_max_body_size 128M;

    access_log /dev/stdout;
    error_log /dev/stderr;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Bloque l'execution PHP dans les repertoires d'upload WordPress.
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # Bloque l'acces direct a des fichiers sensibles courants.
    location ~* ^/(wp-config\.php|readme\.html|license\.txt|composer\.(json|lock)|package(-lock)?\.json|\.user\.ini|php\.ini|opcache\.ini)$ {
        deny all;
    }

    # Bloque les fichiers caches, tout en laissant passer /.well-known si besoin.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass wp:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        log_not_found off;
        access_log off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }
}
