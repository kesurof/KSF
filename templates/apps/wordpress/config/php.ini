; KSF — php.ini optimise pour WordPress (FPM Alpine)
; Genere par render_template depuis templates/apps/wordpress/config/php.ini
; Monte dans le conteneur wp sous /usr/local/etc/php/conf.d/99-wordpress.ini

[PHP]
date.timezone = "${TZ_VALUE}"

; Limites adaptees a WordPress
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
memory_limit = 256M
post_max_size = 128M
upload_max_filesize = 128M

; Securite
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
cgi.fix_pathinfo = 0

; Fichiers et acces distants
file_uploads = On
allow_url_fopen = On
allow_url_include = Off

; Cache chemins PHP
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Sessions
session.use_strict_mode = 1
session.cookie_httponly = 1
