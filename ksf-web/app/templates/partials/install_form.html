<div class="install-form">
    <div class="form-field">
        <label for="install-subdomain">Sous-domaine</label>
        <input type="text" id="install-subdomain" name="subdomain" value="{{ subdomain }}" class="form-input" autocomplete="off" required>
    </div>
    <div class="form-field">
        <label for="install-port">Port</label>
        <input type="text" id="install-port" name="port" value="{{ port }}" class="form-input" autocomplete="off" required pattern="[0-9]+">
    </div>
    <div class="form-field">
        <label class="form-checkbox">
            <input type="checkbox" id="install-protected" name="protected" {% if protected %}checked{% endif %}>
            Protéger avec OAuth2 Proxy
        </label>
    </div>
    <button class="btn btn-primary btn-block"
            hx-post="/apps/{{ app_name }}/install"
            hx-include="#install-subdomain, #install-port, #install-protected"
            hx-on::after-request="if(event.detail.xhr.status===200){closeInstallModal();showToast(JSON.parse(event.detail.xhr.responseText).message,true)}else{showToast(JSON.parse(event.detail.xhr.responseText).detail,false)}">
        Confirmer l'installation
    </button>
</div>
