<div class="modal-bg confirm-modal-bg" id="confirm-modal" onclick="if(event.target===this)confirmDialogResolve(false)" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body" hidden>
    <div class="modal confirm-modal">
        <div class="modal-head">
            <h2 id="confirm-title">Confirmer</h2>
            <button class="modal-x" type="button" aria-label="Annuler" onclick="confirmDialogResolve(false)">&times;</button>
        </div>
        <div class="modal-body">
            <p id="confirm-body" class="confirm-message">Êtes-vous sûr ?</p>
            <div id="confirm-typed" class="confirm-typed" hidden>
                <label for="confirm-typed-input" id="confirm-typed-label">Tapez la valeur ci-dessous pour confirmer :</label>
                <input type="text" id="confirm-typed-input" class="form-input" autocomplete="off">
            </div>
        </div>
        <div class="modal-foot">
            <button type="button" class="btn" id="confirm-cancel" onclick="confirmDialogResolve(false)">Annuler</button>
            <button type="button" class="btn btn-danger" id="confirm-ok" onclick="confirmDialogResolve(true)">Confirmer</button>
        </div>
    </div>
</div>
<script>
    (function () {
        // Queue de confirmations : si plusieurs appels à openConfirm sont faits
        // pendant qu'une modale est ouverte, ils sont enfilés et résolus
        // séquentiellement. Pas de race possible entre htmx et l'utilisateur.
        var queue = [];
        var current = null;  // { resolve, opts } de la confirmation en cours
        var pendingAction = null;  // Function à appeler si confirmé

        var modal, titleEl, bodyEl, typedWrap, typedInput, typedLabel, okBtn, cancelBtn;

        function getRefs() {
            modal = document.getElementById('confirm-modal');
            if (!modal) return false;
            titleEl = document.getElementById('confirm-title');
            bodyEl = document.getElementById('confirm-body');
            typedWrap = document.getElementById('confirm-typed');
            typedInput = document.getElementById('confirm-typed-input');
            typedLabel = document.getElementById('confirm-typed-label');
            okBtn = document.getElementById('confirm-ok');
            cancelBtn = document.getElementById('confirm-cancel');
            return true;
        }

        function showNext() {
            if (queue.length === 0) {
                current = null;
                pendingAction = null;
                if (modal) {
                    modal.classList.remove('on');
                    modal.hidden = true;
                }
                document.body.style.overflow = '';
                // Ré-active le main quand la modale est fermée (P2.4 inert/focus-trap).
                _setMainInert(false);
                return;
            }
            current = queue.shift();
            pendingAction = current.opts.action;
            // Indicateur "Étape N/M" si plusieurs confirmations en file (P2.5)
            var stepInfo = '';
            if (queue.length > 0) {
                stepInfo = ' (Étape 1/' + (queue.length + 1) + ')';
            } else if (current.opts.step) {
                stepInfo = ' (Étape ' + current.opts.step + ')';
            }
            titleEl.textContent = (current.opts.title || 'Confirmer') + stepInfo;
            bodyEl.textContent = current.opts.body || 'Êtes-vous sûr ?';
            okBtn.textContent = current.opts.okLabel || 'Confirmer';
            okBtn.className = 'btn ' + (current.opts.dangerous ? 'btn-danger' : 'btn-primary');
            if (current.opts.typed) {
                typedWrap.hidden = false;
                typedLabel.textContent = 'Tapez « ' + current.opts.typed + ' » pour confirmer :';
                typedInput.value = '';
                okBtn.disabled = true;
            } else {
                typedWrap.hidden = true;
                okBtn.disabled = false;
            }
            modal.hidden = false;
            requestAnimationFrame(function () { modal.classList.add('on'); });
            document.body.style.overflow = 'hidden';
            // Désactive le main (P2.4 inert) pour bloquer Tab hors modale.
            _setMainInert(true);
            setTimeout(function () { cancelBtn.focus(); }, 30);
        }

        // Focus trap + inert (P2.4) : bloque Tab hors de la modale et
        // rend tout le chrome (sidebar, main, header) non-interactif
        // quand la modale est ouverte. Sélecteurs couvrent la nav
        // latérale, le contenu principal et tout overlay éventuel.
        function _setMainInert(active) {
            var sels = ['.main', '.sidebar', 'header', '.overlay'];
            for (var i = 0; i < sels.length; i++) {
                var els = document.querySelectorAll(sels[i]);
                for (var j = 0; j < els.length; j++) {
                    if (active) els[j].setAttribute('inert', '');
                    else els[j].removeAttribute('inert');
                }
            }
        }

        // Intercepte Tab pour piéger le focus dans la modale (P2.4)
        function _trapTab(e) {
            if (e.key !== 'Tab' || !modal || modal.hidden) return;
            var focusable = modal.querySelectorAll(
                'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
            );
            if (!focusable.length) return;
            var first = focusable[0];
            var last = focusable[focusable.length - 1];
            if (e.shiftKey && document.activeElement === first) {
                e.preventDefault();
                last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault();
                first.focus();
            }
        }

        function resolveCurrent(ok) {
            if (!current) return;
            var resolver = current.resolve;
            var action = pendingAction;
            current = null;
            pendingAction = null;
            resolver(ok);
            if (ok && action) {
                try { action(); } catch (e) { console.error('confirm action failed', e); }
            }
            // Petite pause pour laisser l'animation de fermeture jouer
            setTimeout(showNext, 100);
        }

        function openConfirm(opts) {
            if (!getRefs()) return Promise.resolve(false);
            opts = opts || {};
            // Si une confirmation est déjà en cours, on enfile celle-ci.
            // Le caller reçoit une Promise qui sera résolue à son tour.
            return new Promise(function (resolve) {
                queue.push({
                    resolve: resolve,
                    opts: {
                        title: opts.title || 'Confirmer',
                        body: opts.body || 'Êtes-vous sûr ?',
                        okLabel: opts.okLabel || 'Confirmer',
                        dangerous: opts.dangerous,
                        typed: opts.typed || null,
                        action: opts.action || null,
                    },
                });
                if (queue.length === 1 && !current) {
                    showNext();
                }
            });
        }

        if (getRefs()) {
            // Focus-trap : Tab est piégé dans la modale (P2.4)
            modal.addEventListener('keydown', _trapTab);
            // On attache les listeners une seule fois, sur le bouton "Confirmer"
            // et sur la frappe dans l'input "typed"
            okBtn.addEventListener('click', function () {
                if (!current) return;
                if (current.opts.typed && typedInput.value !== current.opts.typed) {
                    typedInput.focus();
                    typedInput.classList.add('form-input-err');
                    setTimeout(function () { typedInput.classList.remove('form-input-err'); }, 600);
                    return;
                }
                resolveCurrent(true);
            });
            cancelBtn.addEventListener('click', function () { resolveCurrent(false); });
            // La fermeture par clic sur le backdrop (modal-bg) résout aussi
            modal.addEventListener('click', function (e) {
                if (e.target === modal) resolveCurrent(false);
            });
            typedInput.addEventListener('input', function () {
                if (current && current.opts.typed) {
                    okBtn.disabled = (typedInput.value !== current.opts.typed);
                }
            });
            typedInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !okBtn.disabled) {
                    e.preventDefault();
                    resolveCurrent(true);
                }
            });
        }

        // Expose l'API globale (utilisée par base.html)
        window.openConfirm = openConfirm;
        window.confirmDialogResolve = resolveCurrent;
    })();
</script>
