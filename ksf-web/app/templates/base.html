<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0b0e13">
    <title>{% block title %}KSF{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b0e13'/><text x='16' y='22' text-anchor='middle' font-family='monospace' font-size='14' font-weight='bold' fill='%2300d9a3'>k</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/vendor/github-dark.min.css">
    <script src="/static/vendor/htmx.min.js" defer></script>
    <script src="/static/vendor/highlight.min.js" defer></script>
    <script>
    // Colorisation syntaxique des <pre class="logs"> après chargement et après swaps htmx.
    document.addEventListener('DOMContentLoaded', function () {
        if (window.hljs) hljs.highlightAll();
    });
    document.body.addEventListener('htmx:afterSwap', function () {
        if (window.hljs) {
            document.querySelectorAll('pre.logs').forEach(function (el) { hljs.highlightElement(el); });
        }
    });
    </script>
</head>
<body>
    <a href="#main-content" class="skip-link">Aller au contenu</a>

    <button class="menu-btn"
            type="button"
            aria-label="Ouvrir le menu"
            aria-expanded="false"
            aria-controls="sidebar"
            onclick="toggleSidebar()">☰</button>

    <div class="overlay" id="overlay" onclick="closeSidebar()" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="Navigation principale">
        <div class="sidebar-brand">
            <span class="brand-icon" aria-hidden="true">ksf</span>
            <div class="brand-text">
                <h1>KSF</h1>
                <span class="brand-ver">v2.0.0</span>
            </div>
        </div>

        <nav aria-label="Sections">
            <div class="sidebar-section-title">Services</div>
            <a href="/" class="sidebar-link {% if request.url.path == '/' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Tableau de bord
            </a>
            <a href="/containers" class="sidebar-link {% if '/containers' in request.url.path %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="6" r="1"/><circle cx="6" cy="18" r="1"/><circle cx="18" cy="6" r="1"/><circle cx="18" cy="18" r="1"/></svg>
                Containers
            </a>
            <a href="/apps" class="sidebar-link {% if '/apps' in request.url.path %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                Applications
            </a>

            <div class="sidebar-section-title">Système</div>
            <a href="/backups" class="sidebar-link {% if '/backups' in request.url.path %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Sauvegardes
            </a>
            <a href="/jobs" class="sidebar-link {% if '/jobs' in request.url.path %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Jobs
            </a>
            <a href="/config" class="sidebar-link {% if '/config' in request.url.path %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                Configuration
            </a>
            <a href="/audit" class="sidebar-link {% if '/audit' in request.url.path %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                Audit
            </a>
            <a href="/settings/webhooks" class="sidebar-link {% if '/webhooks' in request.url.path %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
                Webhooks
            </a>
            <a href="/security" class="sidebar-link {% if '/security' in request.url.path and 'tab' not in request.url.query %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Sécurité
            </a>

            <div class="sidebar-section-title">Plateforme</div>
            <a href="/diagnostics" class="sidebar-link {% if '/diagnostics' in request.url.path %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                Diagnostics
            </a>
            <a href="/maintenance" class="sidebar-link {% if '/maintenance' in request.url.path %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                Maintenance
            </a>
        </nav>

        <div class="sidebar-footer">
            <span class="pulse" aria-hidden="true"></span>
            <span>Système en ligne</span>
        </div>
    </aside>

    <main class="main" id="main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    <div id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

    {% include "partials/confirm_modal.html" %}

    <script>
        (function () {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('overlay');
            var menuBtn = document.querySelector('.menu-btn');

            function isOpen() { return sidebar.classList.contains('open'); }

            window.toggleSidebar = function () {
                var open = !isOpen();
                sidebar.classList.toggle('open', open);
                overlay.classList.toggle('on', open);
                if (menuBtn) menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
            };

            window.closeSidebar = function () {
                if (!isOpen()) return;
                sidebar.classList.remove('open');
                overlay.classList.remove('on');
                if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
            };

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && isOpen()) window.closeSidebar();
            });

            // Close drawer on navigation (mobile)
            document.querySelectorAll('.sidebar-link').forEach(function (a) {
                a.addEventListener('click', function () { if (isOpen()) window.closeSidebar(); });
            });

            window.showToast = function (msg, ok, type) {
                var c = document.getElementById('toasts');
                if (!c) return;
                var t = document.createElement('div');
                t.className = 'toast';
                if (ok === true) t.classList.add('toast-ok');
                else if (ok === false) t.classList.add('toast-err');
                else if (type === 'warn') t.classList.add('toast-warn');
                t.setAttribute('role', ok === false ? 'alert' : 'status');
                t.textContent = msg;
                t.addEventListener('click', function () { dismiss(t); });
                c.appendChild(t);
                requestAnimationFrame(function () { t.classList.add('show'); });
                setTimeout(function () { dismiss(t); }, 4500);
            };

            function dismiss(t) {
                if (!t || !t.parentNode) return;
                t.classList.remove('show');
                setTimeout(function () { t.remove(); }, 200);
            }

            document.body.addEventListener('htmx:responseError', function (e) {
                var detail = 'Erreur réseau';
                try { detail = (JSON.parse(e.detail.xhr.responseText || '{}').detail) || detail; } catch (err) {}
                window.showToast(detail, false);
            });
            document.body.addEventListener('htmx:sendError', function () {
                window.showToast('Connexion perdue', false);
            });

            // CSRF: inject cookie value as X-CSRF-Token on every htmx request
            function getCookie(name) {
                var m = document.cookie.match(new RegExp('(^|; )' + name + '=([^;]*)'));
                return m ? decodeURIComponent(m[2]) : '';
            }
            document.body.addEventListener('htmx:configRequest', function (e) {
                var t = getCookie('ksf_csrf');
                if (t) e.detail.headers['X-CSRF-Token'] = t;
            });

            document.body.addEventListener('htmx:afterRequest', function (e) {
                var xhr = e.detail && e.detail.xhr;
                if (!xhr || xhr.status < 200 || xhr.status >= 300) return;
                if (xhr.getResponseHeader('content-type') &&
                    xhr.getResponseHeader('content-type').indexOf('application/json') === -1) return;
                try {
                    var body = JSON.parse(xhr.responseText || '{}');
                    if (body && body.message) window.showToast(body.message, true);
                } catch (err) { /* non-JSON success body: ignore */ }
            });

            // Notification badge: retiré en item 7 (suppression UI notifications).
            // Le table `notifications` reste en DB pour audit du dispatch webhooks.

            // Confirmation prompts (custom modal, async). Intercepts htmx-triggered actions.
            // Le bouton ne déclenche pas l'action tant que l'user n'a pas confirmé.
            // On rejoue ensuite l'action via htmx.trigger pour bénéficier des headers CSRF.
            document.body.addEventListener('click', function (e) {
                var b = e.target.closest('[data-confirm], [data-confirm2]');
                if (!b) return;
                e.preventDefault();
                e.stopImmediatePropagation();

                var first = b.getAttribute('data-confirm') || b.getAttribute('data-confirm2');
                var second = b.getAttribute('data-confirm2');
                var dangerous = b.classList.contains('btn-danger') || b.classList.contains('btn-warn');
                var typed = b.getAttribute('data-confirm-typed') || null;

                // Action à exécuter si l'user confirme. On retire les attributs
                // data-confirm* temporairement pour éviter la récursion, puis
                // on re-déclenche le click (htmx récupère et envoie la requête).
                var proceed = function () {
                    var c1 = b.getAttribute('data-confirm');
                    var c2 = b.getAttribute('data-confirm2');
                    b.removeAttribute('data-confirm');
                    b.removeAttribute('data-confirm2');
                    htmx.trigger(b, 'click');
                    if (c1) b.setAttribute('data-confirm', c1);
                    if (c2) b.setAttribute('data-confirm2', c2);
                };

                window.openConfirm({ title: 'Confirmation', body: first, dangerous: dangerous, typed: typed, action: null })
                    .then(function (ok1) {
                        if (!ok1) return;
                        if (!second) { proceed(); return; }
                        window.openConfirm({ title: 'Confirmation (2/2)', body: second, dangerous: true, action: null })
                            .then(function (ok2) { if (ok2) proceed(); });
                    });
            }, true);
        })();
    </script>
</body>
</html>
