<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0b0e13">
    <title>{% block title %}KSF{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Aller au contenu</a>

    <button class="menu-btn"
            type="button"
            aria-label="Ouvrir le menu"
            aria-expanded="false"
            aria-controls="sidebar"
            onclick="toggleSidebar()">☰</button>

    <div class="overlay" id="overlay" onclick="closeSidebar()" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="Navigation principale">
        <div class="sidebar-brand">
            <span class="brand-icon" aria-hidden="true">ksf</span>
            <div class="brand-text">
                <h1>Serverbox</h1>
                <span class="brand-ver">v1.0.2</span>
            </div>
        </div>

        <nav aria-label="Sections">
            <div class="sidebar-section-title">Services</div>
            <a href="/" class="sidebar-link {% if request.url.path == '/' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Tableau de bord
            </a>
            <a href="/containers" class="sidebar-link {% if '/containers' in request.url.path %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="6" r="1"/><circle cx="6" cy="18" r="1"/><circle cx="18" cy="6" r="1"/><circle cx="18" cy="18" r="1"/></svg>
                Containers
            </a>
            <a href="/apps" class="sidebar-link {% if '/apps' in request.url.path %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                Applications
            </a>

            <div class="sidebar-section-title">Système</div>
            <a href="/backups" class="sidebar-link {% if '/backups' in request.url.path %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Sauvegardes
            </a>
            <a href="/security" class="sidebar-link {% if '/security' in request.url.path %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Sécurité
            </a>
        </nav>

        <div class="sidebar-footer">
            <span class="pulse" aria-hidden="true"></span>
            <span>Système en ligne</span>
        </div>
    </aside>

    <main class="main" id="main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    <div id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

    <script>
        (function () {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('overlay');
            var menuBtn = document.querySelector('.menu-btn');

            function isOpen() { return sidebar.classList.contains('open'); }

            window.toggleSidebar = function () {
                var open = !isOpen();
                sidebar.classList.toggle('open', open);
                overlay.classList.toggle('on', open);
                if (menuBtn) menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
            };

            window.closeSidebar = function () {
                if (!isOpen()) return;
                sidebar.classList.remove('open');
                overlay.classList.remove('on');
                if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
            };

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && isOpen()) window.closeSidebar();
            });

            // Close drawer on navigation (mobile)
            document.querySelectorAll('.sidebar-link').forEach(function (a) {
                a.addEventListener('click', function () { if (isOpen()) window.closeSidebar(); });
            });

            window.showToast = function (msg, ok, type) {
                var c = document.getElementById('toasts');
                if (!c) return;
                var t = document.createElement('div');
                t.className = 'toast';
                if (ok === true) t.classList.add('toast-ok');
                else if (ok === false) t.classList.add('toast-err');
                else if (type === 'warn') t.classList.add('toast-warn');
                t.setAttribute('role', ok === false ? 'alert' : 'status');
                t.textContent = msg;
                t.addEventListener('click', function () { dismiss(t); });
                c.appendChild(t);
                requestAnimationFrame(function () { t.classList.add('show'); });
                setTimeout(function () { dismiss(t); }, 4500);
            };

            function dismiss(t) {
                if (!t || !t.parentNode) return;
                t.classList.remove('show');
                setTimeout(function () { t.remove(); }, 200);
            }

            document.body.addEventListener('htmx:responseError', function (e) {
                var detail = 'Erreur réseau';
                try { detail = (JSON.parse(e.detail.xhr.responseText || '{}').detail) || detail; } catch (err) {}
                window.showToast(detail, false);
            });
            document.body.addEventListener('htmx:sendError', function () {
                window.showToast('Connexion perdue', false);
            });
            document.body.addEventListener('htmx:afterRequest', function (e) {
                var xhr = e.detail && e.detail.xhr;
                if (!xhr || xhr.status < 200 || xhr.status >= 300) return;
                if (xhr.getResponseHeader('content-type') &&
                    xhr.getResponseHeader('content-type').indexOf('application/json') === -1) return;
                try {
                    var body = JSON.parse(xhr.responseText || '{}');
                    if (body && body.message) window.showToast(body.message, true);
                } catch (err) { /* non-JSON success body: ignore */ }
            });

            // Confirmation prompts (single + double)
            document.body.addEventListener('click', function (e) {
                var b = e.target.closest('[data-confirm]');
                if (b && !window.confirm(b.getAttribute('data-confirm'))) {
                    e.preventDefault(); e.stopPropagation();
                }
                var b2 = e.target.closest('[data-confirm2]');
                if (b2) {
                    if (!window.confirm(b2.getAttribute('data-confirm2'))) {
                        e.preventDefault(); e.stopPropagation(); return;
                    }
                    if (!window.confirm('Confirmer une seconde fois.')) {
                        e.preventDefault(); e.stopPropagation();
                    }
                }
            }, true);
        })();
    </script>
</body>
</html>
